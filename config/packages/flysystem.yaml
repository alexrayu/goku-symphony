services:
    s3.client:
        class: Aws\S3\S3Client
        arguments:
            -
                version: latest
                region: us-east-1
                endpoint: '%env(S3_ENDPOINT)%'
                use_path_style_endpoint: true
                credentials:
                    key: '%env(S3_KEY)%'
                    secret: '%env(S3_SECRET)%'

flysystem:
    storages:
        default.storage:
            adapter: 'aws'
            options:
                client: 's3.client'
                bucket: '%env(S3_BUCKET)%'
