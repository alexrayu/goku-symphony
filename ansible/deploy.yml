# Ships app_ref (override with -e app_ref=<branch|tag|sha>) as a new release, then switches to it.
- name: Deploy a release
  hosts: all
  become: true
  vars:
    keep_releases: 3

  tasks:
    # set_fact pins the timestamp; a plain var would re-run the lookup on every use.
    - name: Name the release
      ansible.builtin.set_fact:
        release: "{{ app_root }}/releases/{{ lookup('pipe', 'date -u +%Y%m%d%H%M%S') }}"

    # Build the release next to the live one; nothing visible changes until the symlink switch.
    - name: Build the release
      become_user: "{{ app_user }}"
      block:
        - name: Fetch the code
          ansible.builtin.git:
            repo: "{{ app_repo }}"
            version: "{{ app_ref }}"
            dest: "{{ release }}"
            depth: 1

        - name: Link the shared env file
          ansible.builtin.file:
            src: "{{ app_root }}/shared/.env.local"
            dest: "{{ release }}/.env.local"
            state: link

        # Auto-scripts run cache:clear, assets:install and importmap:install for the prod env.
        - name: Install dependencies
          ansible.builtin.command:
            cmd: composer install --no-dev --classmap-authoritative --no-interaction --no-progress
            chdir: "{{ release }}"
          changed_when: true

        - name: Compile assets
          ansible.builtin.command:
            cmd: php bin/console asset-map:compile
            chdir: "{{ release }}"
          changed_when: true

        - name: Run migrations
          ansible.builtin.command:
            cmd: php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
            chdir: "{{ release }}"
          register: migrations
          changed_when: "'No migrations to execute' not in migrations.stdout + migrations.stderr"

    # Switch: rename over the old link is atomic, then reset OPcache and the worker.
    - name: Switch current to the release
      ansible.builtin.file:
        src: "{{ release }}"
        dest: "{{ app_root }}/current"
        state: link
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        force: true

    - name: Reload PHP-FPM
      ansible.builtin.service:
        name: "php{{ php_version }}-fpm"
        state: reloaded

    - name: Restart the worker
      ansible.builtin.systemd_service:
        name: goku-worker
        state: restarted

    - name: List releases
      ansible.builtin.find:
        paths: "{{ app_root }}/releases"
        file_type: directory
      register: releases

    - name: Remove old releases
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ (releases.files | map(attribute='path') | sort)[:-keep_releases] }}"
