# Host setup: packages, services, Nginx, TLS, worker unit. Run once, and again after changes here.
# Code goes out with deploy.yml.
- name: Provision the droplet
  hosts: all
  become: true
  vars_files:
    - secrets.yml

  pre_tasks:
    - name: Refuse placeholder values
      ansible.builtin.assert:
        that:
          - app_hostname != 'TODO'
          - ansible_distribution == 'Ubuntu' and ansible_distribution_version == '24.04'
        fail_msg: Set app_hostname, and target Ubuntu 24.04.

  tasks:
    # Packages. PHP comes from the ondrej PPA: 24.04 ships 8.3, the lock needs 8.4.
    - name: Install the deb822 module dependency
      ansible.builtin.apt:
        name: python3-debian
        update_cache: true

    - name: Add the PHP PPA
      ansible.builtin.deb822_repository:
        name: ondrej-php
        uris: https://ppa.launchpadcontent.net/ondrej/php/ubuntu
        suites: "{{ ansible_distribution_release }}"
        components: main
        signed_by: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xB8DC7E53946656EFBCE4C1DD71DAEAAB4AD4CAB6

    - name: Install packages
      ansible.builtin.apt:
        update_cache: true
        name:
          - nginx
          - "postgresql-{{ postgres_version }}"
          - redis-server
          - libvips-tools
          - git
          - unzip
          - ufw
          - "php{{ php_version }}-fpm"
          - "php{{ php_version }}-cli"
          - "php{{ php_version }}-intl"
          - "php{{ php_version }}-pgsql"
          - "php{{ php_version }}-zip"
          - "php{{ php_version }}-redis"
          - "php{{ php_version }}-opcache"
          - "php{{ php_version }}-mbstring"
          - "php{{ php_version }}-xml"

    - name: Read the installed Redis version
      ansible.builtin.command: redis-server --version
      register: redis_installed
      changed_when: false

    - name: Check Redis matches versions.env
      ansible.builtin.assert:
        that: "'v=' ~ redis_version ~ '.' in redis_installed.stdout"
        fail_msg: "versions.env wants Redis {{ redis_version }}: {{ redis_installed.stdout }}"

    - name: Install Composer
      ansible.builtin.get_url:
        url: "https://getcomposer.org/download/{{ composer_version }}/composer.phar"
        checksum: "sha256:https://getcomposer.org/download/{{ composer_version }}/composer.phar.sha256sum"
        dest: /usr/local/bin/composer
        mode: "0755"

    # App user and directories. Nginx reads storage through the group for X-Accel-Redirect.
    - name: Create the app user
      ansible.builtin.user:
        name: "{{ app_user }}"
        home: "{{ app_root }}"
        shell: /bin/bash
        system: true

    - name: Let Nginx read app files
      ansible.builtin.user:
        name: www-data
        groups: "{{ app_user }}"
        append: true
      notify: Restart nginx

    - name: Create app directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0750"
      loop:
        - "{{ app_root }}"
        - "{{ app_root }}/releases"
        - "{{ app_root }}/shared"
        - "{{ app_root }}/shared/storage"

    # PostgreSQL: local TCP only, password auth.
    - name: Enable PostgreSQL
      ansible.builtin.service:
        name: postgresql
        state: started
        enabled: true

    # SQL on stdin so psql quotes the password (:'pw'); -c would skip variable interpolation.
    - name: Create the database role
      ansible.builtin.command:
        argv: [psql, -v, ON_ERROR_STOP=1, -v, "pw={{ db_password }}"]
        stdin: |
          SELECT NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ app_user }}') AS missing \gset
          \if :missing
          CREATE ROLE {{ app_user }} LOGIN;
          \endif
          ALTER ROLE {{ app_user }} PASSWORD :'pw';
      become_user: postgres
      changed_when: false
      no_log: true

    - name: Check for the database
      ansible.builtin.command:
        cmd: psql -tAc "SELECT 1 FROM pg_database WHERE datname = '{{ app_user }}'"
      become_user: postgres
      register: db_exists
      changed_when: false

    - name: Create the database
      ansible.builtin.command:
        cmd: createdb -O {{ app_user }} {{ app_user }}
      become_user: postgres
      when: db_exists.stdout != '1'

    - name: Enable Redis
      ansible.builtin.service:
        name: redis-server
        state: started
        enabled: true

    # Symfony env. Secrets live here, outside every release.
    - name: Write the app env file
      ansible.builtin.template:
        src: env.local.j2
        dest: "{{ app_root }}/shared/.env.local"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0600"
      no_log: true

    # PHP-FPM: one pool as the app user, sized for 2 GB shared with PostgreSQL and the worker.
    - name: Configure the PHP-FPM pool
      ansible.builtin.template:
        src: fpm-pool.conf.j2
        dest: "/etc/php/{{ php_version }}/fpm/pool.d/www.conf"
        mode: "0644"
      notify: Restart php-fpm

    - name: Configure PHP for production
      ansible.builtin.template:
        src: php.ini.j2
        dest: "/etc/php/{{ php_version }}/{{ item }}/conf.d/90-app.ini"
        mode: "0644"
      loop: [fpm, cli]
      notify: Restart php-fpm

    - name: Enable PHP-FPM
      ansible.builtin.service:
        name: "php{{ php_version }}-fpm"
        state: started
        enabled: true

    # TLS: Cloudflare origin certificate, valid only behind Cloudflare (Full strict).
    - name: Create the TLS directory
      ansible.builtin.file:
        path: /etc/ssl/goku
        state: directory
        mode: "0700"

    - name: Install the origin certificate and key
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "/etc/ssl/goku/{{ item.name }}"
        mode: "0600"
      loop:
        - { name: origin.pem, content: "{{ tls_origin_cert }}" }
        - { name: origin.key, content: "{{ tls_origin_key }}" }
      loop_control:
        label: "{{ item.name }}"
      notify: Reload nginx

    # Nginx. Client IPs come from CF-Connecting-IP, trusted only from Cloudflare ranges.
    - name: Fetch Cloudflare IP ranges
      ansible.builtin.uri:
        url: "https://www.cloudflare.com/ips-{{ item }}"
        return_content: true
      loop: [v4, v6]
      register: cloudflare_ips
      check_mode: false

    - name: Collect Cloudflare IP ranges
      ansible.builtin.set_fact:
        cloudflare_ranges: "{{ cloudflare_ips.results | map(attribute='content') | map('split') | flatten }}"

    - name: Configure the Nginx site
      ansible.builtin.template:
        src: nginx-site.conf.j2
        dest: /etc/nginx/sites-available/goku
        mode: "0644"
      notify: Reload nginx

    - name: Enable the Nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/goku
        dest: /etc/nginx/sites-enabled/goku
        state: link
      notify: Reload nginx

    - name: Disable the default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Enable Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    # Messenger worker. Started by deploy.yml once a release exists.
    - name: Install the worker unit
      ansible.builtin.template:
        src: worker.service.j2
        dest: /etc/systemd/system/goku-worker.service
        mode: "0644"
      notify: Reload systemd

    - name: Enable the worker
      ansible.builtin.systemd_service:
        name: goku-worker
        enabled: true
        daemon_reload: true

    # Firewall: SSH from anywhere, web only from Cloudflare.
    - name: Configure the firewall
      when: firewall_enabled
      block:
        - name: Allow SSH
          community.general.ufw:
            rule: allow
            name: OpenSSH

        - name: Allow web traffic from Cloudflare
          community.general.ufw:
            rule: allow
            proto: tcp
            port: "{{ item[1] }}"
            from_ip: "{{ item[0] }}"
          loop: "{{ cloudflare_ranges | product(['80', '443']) | list }}"
          loop_control:
            label: "{{ item[0] }}:{{ item[1] }}"

        - name: Deny everything else
          community.general.ufw:
            state: enabled
            policy: deny

  handlers:
    - name: Restart php-fpm
      ansible.builtin.service:
        name: "php{{ php_version }}-fpm"
        state: restarted

    - name: Restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted

    - name: Reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded

    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
