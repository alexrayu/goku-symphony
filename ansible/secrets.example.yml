# Copy to secrets.yml (gitignored) and fill in. Keep a copy outside the repo.
app_secret: "generate with: openssl rand -hex 32"
db_password: "generate with: openssl rand -hex 24"

# Cloudflare dashboard > SSL/TLS > Origin Server > Create certificate (PEM).
tls_origin_cert: |
  -----BEGIN CERTIFICATE-----
  ...
  -----END CERTIFICATE-----
tls_origin_key: |
  -----BEGIN PRIVATE KEY-----
  ...
  -----END PRIVATE KEY-----
