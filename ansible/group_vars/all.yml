# Pinned in one place for Docker and Ansible.
php_version: "{{ lookup('ini', 'PHP_VERSION', type='properties', file=playbook_dir ~ '/../versions.env') }}"
postgres_version: "{{ lookup('ini', 'POSTGRES_VERSION', type='properties', file=playbook_dir ~ '/../versions.env') }}"
redis_version: "{{ lookup('ini', 'REDIS_VERSION', type='properties', file=playbook_dir ~ '/../versions.env') }}"
composer_version: "2.10.3"

app_hostname: TODO   # subdomain pointed at the droplet by a proxied Cloudflare DNS record
app_user: goku
app_root: /srv/goku
app_repo: https://github.com/alexrayu/goku-symphony.git
app_ref: main

# Must match the dev container (Dockerfile uploads.ini). Cloudflare Free cuts request bodies at 100 MB.
upload_max_size: 200M

# Off only for local test containers, which cannot run ufw.
firewall_enabled: true
